# nginx inside the web container:
#  1. serves the built React files (dist/)
#  2. forwards /api/... to the API container (and strips "/api"),
#     so browser, website and API all look like ONE site -> cookies just work.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000/;          # trailing / = remove the /api prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real IP for the login rate limit
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React Router: /bookings/5 is not a real file, so send index.html and let React show the page.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Built files have a hash in their name, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
